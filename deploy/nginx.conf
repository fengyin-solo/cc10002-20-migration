# 数据指标分析平台 —— 反向代理子路径部署参考配置
#
# 基准约定（四处基准各自独立，互不拼接）：
#   部署入口   /metric-insight/            前端构建产物（index.html + assets/）
#   静态资源   /metric-insight/assets/     内容哈希命名，长缓存 immutable
#   浏览器路由 /metric-insight/<route>     SPA fallback 回 index.html
#   API 地址   /api/                       根路径反代后端，不进入前端前缀
#
# 本文件同时是 nginx 官方镜像的 envsubst 模板：
#   - 容器化部署时 ${API_UPSTREAM} 由环境变量注入（如 backend:8000）；
#   - 裸机部署时把 ${API_UPSTREAM} 替换成实际后端 host:port 即可，
#     前端构建产物与代码中均不出现任何具体机器地址。
#
# 部署目录结构（由 deploy/deploy.sh 维护）：
#   /srv/metric-insight-web/
#     releases/<版本号>/     每次发布的完整产物（index.html + assets/）
#     current -> releases/<版本号>   原子切换的入口软链
#     assets-pool/           历次发布的哈希资源池（新旧版本资源交错共存）
#     legacy/assets/         旧根路径构建的哈希资源（过渡期保留）

server {
    listen 80;
    server_name _;

    # ---------- 新入口：路径前缀 /metric-insight/ ----------

    # 哈希静态资源：内容寻址，从共享资源池发放；
    # current 切换后旧版本资源仍可访问，缓存的旧入口不会配不到资源
    location /metric-insight/assets/ {
        alias /srv/metric-insight-web/assets-pool/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 入口 HTML：每次回源校验，保证旧入口缓存不会配上新资源
    location = /metric-insight/index.html {
        alias /srv/metric-insight-web/current/index.html;
        add_header Cache-Control "no-cache";
    }

    # 前缀下的前端路由：深链接、刷新都回退到入口 HTML
    location /metric-insight/ {
        alias /srv/metric-insight-web/current/;
        try_files $uri $uri/ /metric-insight/index.html;
        add_header Cache-Control "no-cache";
    }

    # ---------- API：根路径反代，不拼前端子目录 ----------

    location /api/ {
        proxy_pass http://${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 旧根入口兼容 ----------

    # 旧构建的哈希资源（/assets/<hash>）：过渡期继续可访问，
    # 浏览器里缓存的旧入口页面仍能拉到配套旧资源，不会半新半旧。
    # 过渡期结束后清空 legacy/ 并删除本段即可。
    location /assets/ {
        root /srv/metric-insight-web/legacy;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 旧根路径下的历史前端路由（/lineage、/segment 等收藏链接）：
    # 301 映射到新前缀，保留查询串；/ 本身映射到 /metric-insight/。
    location / {
        return 301 /metric-insight$request_uri;
    }
}
